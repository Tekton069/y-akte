<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1a2c">
<title>Die Y-Akte – Fall Laura</title>
<style>
:root{--cream:#f5ead6;--red:#ef4a5c;--pink:#f08cb4;--gold:#e9c46a;--navy:#0f1a2c;--ring:rgba(233,196,106,.55);--dot:#ef4a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--cream);font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow-x:hidden;transition:background .6s}
body[data-theme=navy]{background:#0f1a2c}
body[data-theme=teal]{background:#0b3a46;--ring:rgba(233,196,106,.5)}
body[data-theme=purple]{background:#26154a;--ring:rgba(240,140,180,.5);--dot:#f08cb4}
body[data-theme=blue]{background:#0a3d9a;--ring:rgba(239,74,92,.65);--dot:#f2cf45}
body[data-theme=red]{background:#471424;--ring:rgba(245,234,214,.4)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
 background:repeating-radial-gradient(circle at 88% 38%,transparent 0 11px,var(--ring) 11px 12.5px),
 radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.5px) 0 0/26px 26px;opacity:.9}
#bg svg{position:absolute;left:0;bottom:16%;width:100%;height:120px}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#top{display:flex;justify-content:space-between;align-items:flex-start;min-height:20px}
#snd{background:rgba(255,255,255,.1);border:0;color:var(--cream);border-radius:20px;padding:4px 10px;font-size:15px;cursor:pointer}
h1.t{font-family:'Arial Black','Segoe UI Black',Impact,Arial,sans-serif;font-weight:900;font-size:clamp(30px,9vw,44px);line-height:1.04;margin:6px 0 4px;color:var(--cream);text-shadow:3px 3px 0 rgba(0,0,0,.55);letter-spacing:.2px}
h1.t::after{content:"";display:block;width:46%;height:4px;background:var(--red);margin-top:8px;border-radius:2px}
.sub{font-size:15px;opacity:.9;margin:6px 0 12px;line-height:1.4}
#mon{position:relative;flex:1;border:3px solid #9b9cab;border-radius:20px;background:
 linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/34px 34px,
 linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/34px 34px,#16213a;
 box-shadow:0 14px 34px rgba(0,0,0,.5);padding:14px;display:flex;flex-direction:column;min-height:420px;overflow:hidden}
#mon>i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--dot)}
#mon>i:nth-of-type(1){left:7px;top:7px}#mon>i:nth-of-type(2){right:7px;top:7px}#mon>i:nth-of-type(3){left:7px;bottom:7px}#mon>i:nth-of-type(4){right:7px;bottom:7px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;width:100%}
#prog{display:flex;justify-content:center;align-items:center;gap:0;margin-top:14px}
#prog .pb{width:42px;height:42px;border-radius:50%;background:#16213a;border:2px solid #4b5068;display:flex;align-items:center;justify-content:center;position:relative;transition:.3s}
#prog .pb.on{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,74,92,.25)}
#prog .pb.ok::after{content:"✓";position:absolute;right:-4px;top:-6px;background:var(--red);color:#fff;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
#prog .ln{width:20px;height:2px;background:var(--red)}
.btn{font-family:'Arial Black','Segoe UI Black',Arial,sans-serif;font-weight:900;font-size:17px;background:var(--cream);color:#16213a;border:0;border-radius:14px;padding:13px 22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.45);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid rgba(245,234,214,.45);box-shadow:none}
.hud{display:flex;justify-content:space-between;width:100%;font-family:'Arial Black',Arial,sans-serif;font-size:16px;color:var(--gold)}
.msg{min-height:44px;text-align:center;font-size:15px;line-height:1.35;color:var(--cream);width:100%}
.msg b{color:var(--gold)}
.note{font-size:15px;line-height:1.5;text-align:center}
.card{perspective:600px}
/* memory */
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}
.mc{height:78px;position:relative;transform-style:preserve-3d;transition:transform .35s;cursor:pointer;border:0;background:none;padding:0}
.mc.flip{transform:rotateY(180deg)}
.mc>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.mc .bk{background:#262f4d;border:2px solid #4b5068}
.mc .fr{background:#e8d9bd;color:#26203a;transform:rotateY(180deg);font-family:'Arial Black',Arial,sans-serif;font-size:21px;text-align:center;line-height:1.1}
.mc.done .fr{background:#f2cf45;animation:pulse .5s}
@keyframes pulse{50%{transform:rotateY(180deg) scale(1.1)}}
/* whack */
#holes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.hole{height:92px;background:radial-gradient(ellipse at 50% 88%,#05080f 0 38%,#1c2744 40%);border-radius:12px;position:relative;overflow:hidden;cursor:pointer;border:2px solid #2d3858}
.hole .it{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);transition:bottom .16s;width:64px}
.hole.up .it{bottom:4px}
.hole.hit .it{filter:brightness(2.2)}
.opt{display:flex;flex-direction:column;gap:9px;width:100%}
.opt button{font-size:17px;padding:12px;border-radius:12px;border:2px solid #4b5068;background:#1f2a4a;color:var(--cream);cursor:pointer;font-weight:700}
.opt button.bad{animation:shake .35s;border-color:var(--red)}
.opt button.good{background:#f2cf45;color:#1a1a2a;border-color:#f2cf45}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* billy */
#shelf{position:relative;width:300px;height:330px;margin:0 auto}
#shelf .sl{position:absolute;border:2px dashed #6f7794;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#8b93b0;font-size:14px;cursor:pointer}
#shelf .sl.hot{border-color:var(--gold);background:rgba(242,207,69,.15)}
#shelf .sl.fill{background:linear-gradient(#f3e6cc,#dcc9a3);border:2px solid #a68a5a;color:#7b6034}
#shelf .sl.err{animation:shake .35s}
#tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.pc{border:2px solid #4b5068;background:#1f2a4a;color:var(--cream);border-radius:9px;padding:6px 9px;display:flex;align-items:center;gap:7px;font-weight:900;cursor:pointer;font-size:15px}
.pc.sel{border-color:var(--gold);background:#3a3550;transform:translateY(-3px)}
.pc .sh{background:#dcc9a3;border:1px solid #a68a5a;display:block}
/* puzzle */
#pz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(100%,300px);aspect-ratio:745/890;background:#0a1020;border:3px solid #9b9cab;border-radius:10px;overflow:hidden}

 const cv=$("#cv"),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
 const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);

 const P={x:W/2,y:H-42,r:30},keys={};let items=[],sc=0,life=3,last=performance.now(),acc=0,run=true,raf;

 function ear(x,y,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle="#f4efe3";ctx.beginPath();ctx.ellipse(0,-22,8,24,0,0,7);ctx.fill();ctx.fillStyle="#f3a6b8";ctx.beginPath();ctx.ellipse(0,-21,4,17,0,0,7);ctx.fill();ctx.restore()}

/* ---------- 5: Puzzle + Weggabelung + Ausweis ---------- */
function L5(){
 go("Die<br>Weggabelung","red",`<div class="hud"><span id="s">Züge: 0</span><span>3 × 3</span></div><div id="pz"></div><div class="msg" id="msg">Tippen oder wischen: Teile rutschen in die dunkle Lücke.</div>`,4);
 let tiles=[0,1,2,3,4,5,6,7,8],moves=0,prev=-1;
 const nb=i=>{const r=Math.floor(i/3),c=i%3,o=[];if(r>0)o.push(i-3);if(r<2)o.push(i+3);if(c>0)o.push(i-1);if(c<2)o.push(i+1);return o};
 let bl=8;
 for(let k=0;k<90;k++){const n=nb(bl).filter(x=>x!==prev);const m=pick(n);tiles[bl]=tiles[m];tiles[m]=8;prev=bl;bl=m}
 if(tiles.every((v,i)=>v===i)){tiles[7]=8;tiles[8]=7}
 const pz=$("#pz");
 let won=false,down=-1;
 function draw(){pz.innerHTML="";tiles.forEach((v,i)=>{const d=document.createElement("div");d.className="tl"+(v===8?" bl":"");d.dataset.i=i;const r=Math.floor(v/3),c=v%3;d.style.backgroundPosition=`${c*50}% ${r*50}%`;pz.appendChild(d)})}
 // Antippen ODER Wischen: jedes Teil in der Reihe/Spalte der Lücke rutscht Richtung Lücke
 function tap(i){
  if(won)return;let b=tiles.indexOf(8);if(i===b)return;
  const sameRow=Math.floor(i/3)===Math.floor(b/3),sameCol=i%3===b%3;if(!sameRow&&!sameCol)return;
  const step=sameRow?Math.sign(i-b):3*Math.sign(i-b);
  while(b!==i){const n=b+step;tiles[b]=tiles[n];b=n}tiles[i]=8;
  moves++;$("#s").textContent="Züge: "+moves;sfx.flip();draw();
  if(tiles.every((v,k)=>v===k)){
   won=true;pz.classList.add("won");[...pz.children].forEach(t=>{t.classList.remove("bl");t.style.opacity=1;t.style.cursor="default"});sfx.win();
   toast("<b>Passt auf Laura auf!</b>");setTimeout(Fork,1800);
  }
 }
 const idx=e=>{const t=e.target.closest&&e.target.closest(".tl");return t?+t.dataset.i:-1};
 pz.addEventListener("pointerdown",e=>{e.preventDefault();down=idx(e)});
 pz.addEventListener("pointerup",e=>{const u=idx(e);const d=down;down=-1;
  // Tippen: gleiches Teil. Wischen: Teil, auf dem der Finger startete.
  if(d>=0)tap(d)});
 draw();
}

}
